name: Deploy
# Deploys to Cloudflare on every change to main, or on demand from the Actions tab.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, APP_SECRET.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
    steps:
      - name: Check secrets are set
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$APP_SECRET" ] || missing="$missing APP_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ "${#APP_SECRET}" -lt 16 ]; then
            echo "::error::APP_SECRET must be at least 16 characters."
            exit 1
          fi
          case "$APP_SECRET" in
            *[!A-Za-z0-9_-]*) echo "::error::APP_SECRET may only contain letters, digits, - and _ (it is used in a web address)."; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Find or create the database
        run: node scripts/ensure-db.mjs
      - name: Deploy
        run: |
          umask 077
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify({ APP_SECRET: process.env.APP_SECRET }))'
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Summary
        run: |
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          {
            echo "### Deployed"
            echo "Worker address: ${url:-see the Deploy step log}"
            echo
            echo "- App: \`${url:-https://<worker address>}/a/<your APP_SECRET>/\`"
            echo "- Claude connector: \`${url:-https://<worker address>}/mcp/<your APP_SECRET>\`"
          } >> "$GITHUB_STEP_SUMMARY"
